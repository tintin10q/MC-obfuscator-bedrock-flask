<!doctype html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel='icon' href='{{url_for("static", filename="favicon.ico")}}' type='image/x-icon' sizes="16x16"/>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href='{{url_for("static", filename="css/bootstrap.css")}}'>
    <title>Minecraft code obfuscator</title>
</head>
<body>
<br>
<div class="container text-center">
    <div class="col-md-12">
        <h1>Minecraft code obfuscator</h1>
        <p class="lead">Protect your minecraft bedrock code!</p>
    </div>
</div>
<div class="container">
    <div class="row">
        <div class="col-sm-5">
            <img src="{{url_for('static', filename='logo.png')}}" class="img-fluid">
        </div>

        <div class="col-sm-7">

            <form action="." method="post">
                <b><label for="blacklist_all"> Blacklist: </label></b>

                <div class="form-row" id="blacklist_all">
                    <div class="form-group col-3">
                        <label for="b1">Functions</label>
                        <textarea class="form-control" id="b1" rows="3" placeholder="Functions"></textarea>
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="greedy_functions">
                            <label class="form-check-label" for="greedy_functions">Greedy</label>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="skip_functions">
                            <label class="form-check-label" for="skip_functions">Skip</label>
                        </div>

                    </div>
                    <div class="form-group col-3">
                        <label for="b1">Objectives</label>
                        <textarea class="form-control" id="b2" rows="3" placeholder="Objectives"></textarea>
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="greedy_objectives">
                            <label class="form-check-label" for="greedy_objectives">Greedy</label>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="skip_objectives">
                            <label class="form-check-label" for="skip_objectives">Skip</label>
                        </div>

                    </div>
                    <div class="form-group col-3">
                        <label for="b1">Fakeplayers</label>
                        <textarea class="form-control" id="b3" rows="3" placeholder="Fakeplayers"></textarea>
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="greedy_fakeplayers">
                            <label class="form-check-label" for="greedy_fakeplayers">Greedy</label>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="skip_fake_players">
                            <label class="form-check-label" for="skip_fake_players">Skip</label>
                        </div>

                    </div>
                    <div class="form-group col-3">
                        <label for="b1">Tags</label>
                        <textarea class="form-control" id="b4" rows="3" placeholder="Tags"></textarea>
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="greedy_tags">
                            <label class="form-check-label" for="greedy_tags">Greedy</label>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="skip_tags">
                            <label class="form-check-label" for="skip_tags">Skip</label>
                        </div>


                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group col-6">
                        <label for="character_pool">Character pool</label>
                        <select class="form-control" id="character_pool">
                            <option>O0</option>
                            <option>WV</option>
                            <option>NM</option>
                        </select>
                    </div>
                    <div class="form-group col-6">
                        <label for="name_lenght">Name length</label>
                        <input type="number"  value="16" min="2" max="16" class="form-control"
                               id="name_lenght"
                               placeholder="Name lenght">
                    </div>
                </div>
                <div class="form-group">
                    <label for="datapack">Datapack zip folder</label>
                    <input type="file" class="form-control-file" id="datapack">
                </div>
                <button type="submit" class="btn btn-primary">Obfuscate!</button>
            </form>

        </div>
    </div>
</div>


</body>
</html>
