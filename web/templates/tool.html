<!doctype html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="A tool for obfuscating minecraft bedrock command code."/>
    <meta name="keywords" content="obfuscation, minecraft, code, bedrock, tool">
    <meta name="author" content="Quinten Cabo">
    <link rel='icon' href='{{url_for("static", filename="favicon.ico")}}' type='image/x-icon' sizes="16x16"/>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href='{{url_for("static", filename="css/bootstrap_dark.css")}}'>
    <title>Minecraft code obfuscator</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
    <script data-ad-client="ca-pub-9825615766394229" async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>
</head>
<body>
<br>
<header>
    <div class="container text-center">
        <div class="col-md-12">
            <h1>Minecraft code obfuscator</h1>
            <p class="lead">Protect your minecraft bedrock code!</p>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}

        <div class="alert alert-dismissible fade show alert-{{ category }}"> {{ message }}
            <button type="button" class="close" data-dismiss="alert">&times;</button>
        </div>
        {% endfor %}
        {% endwith %}

    </div>
</header>
<main>
    <div class="container">
        <div class="row">
            <div class="col-sm-5">
                <img src="{{url_for('static', filename='logo.png')}}" class="img-fluid"
                     alt="minecraft obfuscator website logo ">
            </div>

            <div class="col-sm-7">

                <form action="." method="post" enctype=multipart/form-data>
                    <b><label for="blacklist_all"> Blacklist: </label></b>

                    <div class="form-row" id="blacklist_all">
                        <div class="form-group col-3">
                            <label for="function_blacklist">Functions:</label>
                            <textarea class="form-control" id="function_blacklist" name="function_blacklist" rows="3"
                                      placeholder="Functions"></textarea>
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" name="greedy_functions"
                                       id="greedy_functions">
                                <label class="form-check-label" for="greedy_functions" data-toggle="tooltip"
                                       title="A partial match is enough to be blacklisted so 'hi' on the blacklist would blacklist 'hi_there'">
                                    Partial match ⓘ</label>
                            </div>
<!--                            <div class="form-check">-->
<!--                                <input type="checkbox" class="form-check-input" name="whitelist_functions"-->
<!--                                       id="whitelist_functions">-->
<!--                                <label class="form-check-label" for="whitelist_functions" data-toggle="tooltip"-->
<!--                                       title="Make the blacklist a whitelist instead. So only obfuscate these names.">Whitelist</label>-->
<!--                            </div>-->

                        </div>
                        <div class="form-group col-3">
                            <label for="objective_blacklist">Objectives:</label>
                            <textarea class="form-control" id="objective_blacklist" rows="3" name="objective_blacklist"
                                      placeholder="Objectives"></textarea>
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" name="greedy_objectives"
                                       id="greedy_objectives">
                                <label class="form-check-label" data-toggle="tooltip"
                                       title="A partial match is enough to be blacklisted so 'hi' on the blacklist would blacklist 'hi_there'"
                                       for="greedy_objectives">Partial match ⓘ</label>
                            </div>
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" name="whitelist_objectives"
                                       id="whitelist_objectives">
                                <label class="form-check-label" for="whitelist_objectives" data-toggle="tooltip"
                                       title="Make the blacklist a whitelist instead. So only obfuscate these names.">Whitelist</label>
                            </div>

                        </div>
                        <div class="form-group col-3">
                            <label for="fake_players_blacklist">Fakeplayers:</label>
                            <textarea class="form-control" id="fake_players_blacklist" name="fake_players_blacklist"
                                      rows="3"
                                      placeholder="Fake players"></textarea>
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" name="greedy_fake_players"
                                       id="greedy_fake_players">
                                <label class="form-check-label" data-toggle="tooltip"
                                       title="A partial match is enough to be blacklisted so 'hi' on the blacklist would blacklist 'hi_there'"
                                       for="greedy_fake_players">Partial match ⓘ</label>
                            </div>
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" name="whitelist_fake_players"
                                       id="whitelist_fake_players">
                                <label class="form-check-label" for="whitelist_fake_players" data-toggle="tooltip"
                                       title="Make the blacklist a whitelist instead. So only obfuscate these names.">Whitelist</label>
                            </div>

                        </div>
                        <div class="form-group col-3">
                            <label for="tag_blacklist">Tags+Names:</label>
                            <textarea class="form-control" id="tag_blacklist" name="tag_blacklist" rows="3"
                                      placeholder="Tags"></textarea>
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" name="greedy_tags" id="greedy_tags">
                                <label class="form-check-label" for="greedy_tags" data-toggle="tooltip"
                                       title="A partial match is enough to be blacklisted so 'hi' on the blacklist would blacklist 'hi_there'">Partial
                                    match ⓘ</label>
                            </div>
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" name="whitelist_tags" id="whitelist_tags">
                                <label class="form-check-label" for="whitelist_tags" data-toggle="tooltip"
                                       title="Make the blacklist a whitelist instead. So only obfuscate these names.">Whitelist</label>
                            </div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-6">
                            <label for="character_pool">Character pool:</label>
                            <select class="form-control" name="character_pool" id="character_pool">
                                <option>O0</option>
                                <option>WV</option>
                                <option>NM</option>
                                <option>abcdefghijklmnopqrstuvwxyz_0123456789</option>
                            </select>
                        </div>
                        <div class="form-group col-6">
                            <label for="name_length">Obfuscated name length:</label>
                            <input type="number" value="16" min="2" max="16" class="form-control"
                                   id="name_length"
                                   name="name_length"
                                   placeholder="Name length">
                        </div>
                    </div>
                    <div class="form-row ">
                        <div class="form-group col-md-6">
                            <label for="datapack">Datapack zip folder</label>
                            <input type="file" accept="application/zip" name="datapack_zip_file"
                                   class="form-control-file"
                                   id="datapack" required>
                        </div>
                        <div class="form-group col-md-6">
                            <input type="checkbox" name="context-file" id="context-file" class="form-control-checkbox"
                                   checked>
                            <label for="context-file" data-toggle="tooltip"
                                   title="Add a .name_changes.json to the zip that has all name changes.">Include json
                                file with changes</label>

                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Obfuscate!</button>
                </form>
            </div>
        </div>
    </div>
</main>
<div class="container">
    <a href="https://discord.gg/Utc467M"><img height="100" class="rounded float-right mt-4" alt="Discord logo and join"
                                              src="{{ url_for('static', filename='Discord-Logo-White.png') }}"></a>
</div>
<footer class="footer fixed-bottom text-center py-3">
    <span class="text-muted">Created by Quinten Cabo</span>
</footer>
<script>
    $(document).ready(function () {
        $('[data-toggle="tooltip"]').tooltip();
    });
</script>


</body>
</html>
